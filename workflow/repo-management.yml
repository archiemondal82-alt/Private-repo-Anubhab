name: 🛠️ Repo Management

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight — stale check

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  # ─── Auto-label Issues ────────────────────────────────────────────────────
  label-issues:
    name: Auto-label Issues
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Label based on title keywords
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const labels = [];

            if (title.includes("bug") || title.includes("error") || title.includes("fix"))
              labels.push("bug");
            if (title.includes("feat") || title.includes("add") || title.includes("new"))
              labels.push("enhancement");
            if (title.includes("docs") || title.includes("readme") || title.includes("documentation"))
              labels.push("documentation");
            if (title.includes("test") || title.includes("spec"))
              labels.push("testing");
            if (title.includes("perf") || title.includes("speed") || title.includes("optim"))
              labels.push("performance");
            if (title.includes("security") || title.includes("vuln") || title.includes("cve"))
              labels.push("security");
            if (title.includes("question") || title.includes("help") || title.includes("how"))
              labels.push("question");

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels,
              });
            }

      - name: Welcome new issue author
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: author,
              state: "all",
            });

            if (issues.length === 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `👋 Hey @${author}, thanks for opening your first issue! We'll get back to you soon. Please make sure you've included all relevant details and steps to reproduce if this is a bug report.`,
              });
            }

  # ─── PR Checks ─────────────────────────────────────────────────────────────
  pr-checks:
    name: PR Quality Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows convention
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const VALID_PREFIXES = [
              "feat", "fix", "docs", "style", "refactor",
              "test", "chore", "perf", "ci", "build", "revert"
            ];
            const pattern = new RegExp(`^(${VALID_PREFIXES.join("|")})(\\(.+\\))?!?: .+`);

            if (!pattern.test(title)) {
              core.setFailed(
                `❌ PR title "${title}" doesn't follow Conventional Commits format.\n` +
                `Expected: feat|fix|docs|style|refactor|test|chore|perf(scope): description\n` +
                `Example: feat(auth): add JWT refresh token support`
              );
            } else {
              console.log(`✅ PR title is valid: "${title}"`);
            }

      - name: Warn on large PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changes = pr.additions + pr.deletions;
            const LARGE_PR_THRESHOLD = 500;

            if (changes > LARGE_PR_THRESHOLD) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `⚠️ **Large PR Warning**: This PR touches **${changes} lines** (${pr.additions} additions, ${pr.deletions} deletions).\n\nConsider breaking it into smaller, focused PRs for easier review. Large PRs are harder to review thoroughly and increase the risk of introducing bugs.`,
              });
            }

      - name: Auto-assign draft label
        if: github.event.pull_request.draft == true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ["WIP"],
            });

      - name: Welcome first-time contributor
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
            });

            const authorPRs = prs.filter(pr => pr.user.login === author);
            if (authorPRs.length === 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `🎉 Congrats on your first PR, @${author}! Thanks for contributing. A maintainer will review it shortly.`,
              });
            }

  # ─── Stale Bot ─────────────────────────────────────────────────────────────
  stale:
    name: Mark Stale Issues & PRs
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            👻 This issue has been automatically marked as **stale** because it has had
            no activity for **30 days**. It will be closed in 7 days unless there's new activity.
            If this is still relevant, please leave a comment or update the issue.
          stale-pr-message: >
            👻 This PR has been automatically marked as **stale** because it has had
            no activity for **30 days**. It will be closed in 7 days unless there's new activity.
            If you're still working on this, please push an update or leave a comment.
          close-issue-message: "🔒 This issue was closed due to inactivity. Feel free to reopen if it's still relevant."
          close-pr-message: "🔒 This PR was closed due to inactivity. Feel free to reopen if you'd like to continue."
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: "pinned,security,in-progress"
          exempt-pr-labels: "pinned,in-progress"
          stale-issue-label: "stale"
          stale-pr-label: "stale"
